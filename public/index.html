<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Terrarium</title>
<style>
  /* Dark is the aquarium at night; light follows the system unless the toggle says otherwise. The world itself stays dark. */
  :root { --bg: #080a09; --fg: #aab6ae; --dim: #56635b; --line: #1a221d; --hi: #d4dfd7; --panel: #0e1210;
          --warm: #c9b77a; --omni: #b8a76a; --hunter: #c98a6e; --apex: #e0605a; --strike: #6a3a32;
          --ink: rgba(170,182,174,.5); --plantline: rgba(160,200,140,.35); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc;
    --warm: #8a6d14; --omni: #7d6a1e; --hunter: #a4502e; --apex: #c0302a; --strike: #c08a80;
    --ink: rgba(60,70,62,.6); --plantline: rgba(70,120,50,.55); color-scheme: light; } }
  :root[data-theme="light"] {
    --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc;
    --warm: #8a6d14; --omni: #7d6a1e; --hunter: #a4502e; --apex: #c0302a; --strike: #c08a80;
    --ink: rgba(60,70,62,.6); --plantline: rgba(70,120,50,.55); color-scheme: light; }
  #theme { float: right; background: none; border: 1px solid var(--line); color: var(--dim); font: inherit; font-size: 10px;
           padding: 1px 6px; cursor: pointer; }
  #theme:hover { color: var(--hi); }
  #ranges { float: right; display: flex; gap: 4px; text-transform: none; letter-spacing: 0; }
  #ranges button { background: none; border: 1px solid var(--line); color: var(--dim); font: inherit; font-size: 10px; padding: 0 6px; cursor: pointer; }
  #ranges button.on, #ranges button:hover { color: var(--hi); border-color: var(--dim); }
  #span { font-size: 10px; margin: -4px 0 4px; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; background: var(--bg); color: var(--fg); font: 12px/1.5 ui-monospace, Menlo, monospace;
         display: grid; grid-template-columns: 1fr 340px; }
  main { display: grid; place-items: center; padding: 16px; min-width: 0; position: relative; }
  /* Chronicle pop-ups: news slides up at the bottom of the world view, then fades. */
  #toasts { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: min(80%, 620px);
            display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: center; }
  .toast { background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--fg); border: 1px solid var(--line);
           border-left: 3px solid var(--dim); padding: 6px 12px; border-radius: 6px; font-size: 12px; backdrop-filter: blur(4px);
           box-shadow: 0 4px 14px rgba(0,0,0,.25); animation: toast 7s ease forwards; max-width: 100%; }
  .toast.big { border-left-color: hsl(35 85% 55%); font-weight: 600; }
  .toast { pointer-events: auto; cursor: default; }
  .toast.held { animation: none; opacity: 1; }
  .toast.leaving { animation: toastOut 1.2s ease forwards; }
  @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-6px); } }
  @keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 6% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
  #world { max-width: 100%; max-height: calc(100vh - 32px); aspect-ratio: 3 / 2; border: 1px solid var(--line); }
  aside { border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 13px; font-weight: normal; letter-spacing: .2em; text-transform: uppercase; margin: 0; color: var(--hi); }
  h2 { font-size: 11px; font-weight: normal; letter-spacing: .15em; text-transform: uppercase; margin: 0 0 6px; color: var(--dim); }
  .dim { color: var(--dim); }
  #god { color: var(--dim); min-height: 1.5em; }
  #god.thinking { color: var(--warm); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  details { border-top: 1px solid var(--line); padding: 4px 0; }
  summary { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; cursor: pointer; list-style: none; }
  .portrait { width: 22px; height: 22px; }
  summary::-webkit-details-marker { display: none; }
  summary i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  summary b { font-weight: normal; color: var(--hi); font-variant-numeric: tabular-nums; }
  summary small { grid-column: 2 / 4; color: var(--dim); }
  details:hover summary span { color: var(--hi); }
  .new { color: var(--warm); }
  .role-omnivore { color: var(--omni); } .role-hunter { color: var(--hunter); } .role-apex { color: var(--apex); font-weight: bold; }
  pre { margin: 6px 0 4px; padding: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 10.5px; line-height: 1.4;
        max-height: 320px; overflow: auto; white-space: pre; }
  #extinct { color: var(--dim); }
  .total { padding: 2px 0 6px; font-weight: 700; color: var(--dim); }
  .egg { padding: 4px 0; color: hsl(35 85% 55%); font-weight: 600; }
  #extinct s { text-decoration-color: var(--strike); }
  #chart, #drift { width: 100%; height: 120px; display: block; }
  .diet { display: flex; height: 4px; margin: 3px 0 2px; background: var(--line); }
  .diet i { display: block; height: 100%; }
  #events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #events li span { color: var(--dim); margin-right: 6px; }
  a { color: var(--dim); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main><canvas id="world"></canvas><div id="toasts"></div></main>
<aside>
  <div><button id="theme" title="theme: auto, light, dark">auto</button><h1>The Terrarium</h1><div class="dim" id="clock">connecting…</div><div id="god"></div></div>
  <section><h2>Life</h2><div id="species"></div><p id="extinct"></p></section>
  <section><h2>History <span id="ranges"></span></h2><div class="dim" id="span"></div><canvas id="chart"></canvas></section>
  <section><h2>Evolution</h2><canvas id="drift"></canvas><div class="dim">how far each species' code numbers have drifted from how they were written</div></section>
  <section><h2>Chronicle</h2><ul id="events"></ul></section>
  <footer><a href="/miniature.html">god in miniature</a></footer>
</aside>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Theme: auto (system), light or dark, remembered per browser. Charts redraw in the new ink.
{
  const order = ['auto', 'light', 'dark'];
  let theme = 'auto';
  try { theme = localStorage.getItem('theme') ?? 'auto'; } catch {}
  const apply = redraw => {
    if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    $('theme').textContent = theme;
    if (redraw) drawChart(); // not on the first call: the charts' state is not declared yet
  };
  $('theme').onclick = () => { theme = order[(order.indexOf(theme) + 1) % 3]; try { localStorage.setItem('theme', theme); } catch {} apply(true); };
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => apply(true));
  apply(false);
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const canvas = $('world'), g = canvas.getContext('2d');
const terrainCanvas = document.createElement('canvas'), tg = terrainCanvas.getContext('2d');
const reefCanvas = document.createElement('canvas'), rg = reefCanvas.getContext('2d');
let eggs = [], cap = null;
let climate = 0.5, tickRate = 0, lastTick = null, lastTickAt = 0;
const speedLog = []; // [tick, ms] of recent frames, for the measured speed
const trails = new Map();
const SCALE = 2;
let meta, frameMs, cur = null, prev = null, recvAt = 0, rain = 0, tick = 0, season = 1;
let species = [], history = [], events = [], stats = {}, records = {}, traits = {}, corpses = [], highlight = null;
const portraits = new Map();
// Each species' own look, fixed by its name: a shade (saturation, lightness) and a pale marking, so species of the
// same diet colour (all the green plant-eaters) still look different. Unique giants keep their plain look.
const looks = new Map();
function lookOf(sp) {
  if (looks.has(sp.name)) return looks.get(sp.name);
  let h = 2166136261; for (const ch of sp.name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
  const look = sp.unique ? { s: 70, l: 0, pat: 0 } : { s: [48, 70, 92][h % 3], l: [-9, 0, 9][Math.floor(h / 3) % 3], pat: Math.floor(h / 9) % 6 };
  looks.set(sp.name, look); return look;
}
// The marking, drawn inside the body outline (the current path): 1 a crossband, 2 two spots, 3 a centre eye, 4 a back stripe, 5 a rim.
function marking(g, pat, s, hue) {
  if (!pat || s < 1.5) return;
  g.save(); g.clip();
  g.fillStyle = g.strokeStyle = `hsla(${hue} 40% 88% / .7)`;
  if (pat === 1) g.fillRect(-s * 0.18, -s * 2, s * 0.36, s * 4);
  else if (pat === 2) for (const o of [-0.4, 0.4]) { g.beginPath(); g.arc(o * s, 0, s * 0.2, 0, Math.PI * 2); g.fill(); }
  else if (pat === 3) { g.beginPath(); g.arc(0, 0, s * 0.3, 0, Math.PI * 2); g.fill(); }
  else if (pat === 4) g.fillRect(-s * 2, -s * 0.12, s * 4, s * 0.24);
  else { g.lineWidth = s * 0.45; g.stroke(); }
  g.restore();
}
const portraitOf = sp => portraits.get(sp.name) ?? portraits.set(sp.name, portrait(sp)).get(sp.name);
const on = (name, fn) => es.addEventListener(name, e => fn(JSON.parse(e.data)));

const es = new EventSource('/stream');
const FRAME_STRIDE = 13; // must match the server's; an old tab reloads itself to pick up the new viewer
on('meta', m => {
  if (m.FRAME_STRIDE !== FRAME_STRIDE) { location.reload(); return; }
  meta = m;
  frameMs = 2000 / meta.TICKS_PER_SEC;
  canvas.width = meta.W * SCALE; canvas.height = meta.H * SCALE;
  terrainCanvas.width = meta.GW; terrainCanvas.height = meta.GH;
  reefCanvas.width = meta.GW; reefCanvas.height = meta.GH;
});
on('species', list => { species = list; renderSpecies(true); });
on('god', s => {
  $('god').className = s.state;
  const waiting = s.queue?.length ? ` (waiting: ${s.queue.join(', ')})` : '';
  $('god').textContent = s.state === 'thinking' ? `the god is reaching into the ${s.parent}s…${waiting}` : '';
});
on('past', p => { ({ history, events, stats, records, traits } = p); renderEvents(); drawChart(); });
on('terrain', paintTerrain);
on('reef', paintReef);
on('frame', f => {
  prev = cur; cur = unpack(f.c); recvAt = performance.now();
  // Serpents leave a body behind them: remember where each head has been.
  for (const [id, c] of cur) {
    if (species[c.s]?.shape !== 'serpent') continue;
    const t = trails.get(id) ?? []; const last = t[t.length - 1];
    if (!last || Math.hypot(c.x - last.x, c.y - last.y) > 2) { t.push({ x: c.x, y: c.y }); if (t.length > 120) t.shift(); }
    trails.set(id, t);
  }
  for (const id of trails.keys()) if (!cur.has(id)) trails.delete(id);
  // The world's real speed, measured: ticks per second, smoothed (it runs below its target when crowded).
  const nowMs = performance.now();
  // Measured over the last few seconds, not frame to frame: frames can arrive in bursts (a restart, a background tab),
  // and one burst would make the world look hundreds of times faster than it is.
  if (lastTick !== null && f.t < lastTick) speedLog.length = 0; // the world restarted behind us
  speedLog.push([f.t, nowMs]);
  while (speedLog.length > 2 && nowMs - speedLog[1][1] > 5000) speedLog.shift();
  const [t0, ms0] = speedLog[0];
  if (nowMs - ms0 > 1500 && f.t > t0) tickRate = (f.t - t0) / ((nowMs - ms0) / 1000);
  lastTick = f.t; lastTickAt = nowMs;
  rain = f.rain; tick = f.t; season = f.season; corpses = f.corpses; eggs = f.eggs ?? []; cap = f.cap ?? cap;
  renderClock();
});
on('event', e => { events.push(e); renderEvents(); toast(e.text); });

// Chronicle pop-ups over the world: the routine is left to the Chronicle; news gets a moment on screen.
const NOISE = /ever recorded|is born strange|begins to turn|th generation of|have become omnivores|have become grazers again|have given up the dead|have turned to the dead|have become hunters|bred \d+ generations|god rests|wake up changed/;
const BIG = /extinct|hatches|slumber|wakes|lays an egg|species of their own|drifted apart|bones become reef|grows (hungrier|calmer)|world grows smaller|sends|sets \d+|releases/;
function toast(text) {
  if (NOISE.test(text)) return;
  const box = $('toasts'), el = document.createElement('div');
  el.className = 'toast' + (BIG.test(text) ? ' big' : '');
  el.textContent = text;
  box.appendChild(el);
  // Too many: drop the oldest that is not being held under the pointer.
  while (box.children.length > 3) { const old = [...box.children].find(c => !c.classList.contains('held')); if (!old) break; old.remove(); }
  let timer = setTimeout(() => el.remove(), 7000);
  // Hovering holds it on screen; moving away lets it fade.
  el.addEventListener('mouseenter', () => { clearTimeout(timer); el.classList.remove('leaving'); el.classList.add('held'); });
  el.addEventListener('mouseleave', () => { el.classList.remove('held'); el.classList.add('leaving'); timer = setTimeout(() => el.remove(), 1200); });
}
on('history', ({ h, stats: s, records: r, traits: tr }) => {
  history.push(h); stats = s; records = r; traits = tr;
  if (history.length > 4000) history.shift();
  drawChart();
});
$('species').addEventListener('mouseover', e => { highlight = e.target.closest('details')?.dataset.name ?? null; });
$('species').addEventListener('mouseleave', () => { highlight = null; });
es.onerror = () => { $('clock').textContent = 'the glass is dark (server stopped?)'; };

function unpack(c) {
  const m = new Map();
  for (let i = 0; i < c.length; i += FRAME_STRIDE) m.set(c[i], { s: c[i + 1], x: c[i + 2], y: c[i + 3], a: c[i + 4], e: c[i + 5], h: c[i + 6], b: c[i + 7], z: c[i + 8], l: c[i + 9], f: c[i + 10], r: c[i + 11], p: c[i + 12] });
  return m;
}

// Soil darkens with moisture, browns with fertility; plants go from dry gold to wet green.
// Reef: pale bone, solid where dense (≥ 0.6 blocks), faint where it is only starting or wearing away.
function paintReef({ map, thicket, climate: c }) {
  if (!meta) return;
  climate = c;
  const bytes = Uint8Array.from(atob(map), ch => ch.charCodeAt(0)), img = rg.createImageData(meta.GW, meta.GH);
  const brush = thicket ? Uint8Array.from(atob(thicket), ch => ch.charCodeAt(0)) : null;
  for (let i = 0; i < meta.GW * meta.GH; i++) {
    const r = bytes[i] / 255, solid = r >= 0.6, t = brush ? brush[i] / 255 : 0;
    // Thicket: a dark thorny green along the reef, denser = darker and more opaque.
    if (!solid && t > 0.05) { img.data[i * 4] = 28; img.data[i * 4 + 1] = 78 + (1 - t) * 30; img.data[i * 4 + 2] = 40; img.data[i * 4 + 3] = 70 + t * 170; continue; }
    img.data[i * 4] = solid ? 226 : 196; img.data[i * 4 + 1] = solid ? 214 : 186; img.data[i * 4 + 2] = solid ? 190 : 166;
    img.data[i * 4 + 3] = r <= 0 ? 0 : solid ? 235 : 40 + r * 140;
  }
  rg.putImageData(img, 0, 0);
}

function paintTerrain(b64) {
  if (!meta) return;
  const bytes = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  const img = tg.createImageData(meta.GW, meta.GH);
  for (let i = 0; i < meta.GW * meta.GH; i++) {
    const p = bytes[i * 3] / 255, m = bytes[i * 3 + 1] / 255, f = bytes[i * 3 + 2] / 255;
    const r = 13 + f * 30, gr = 13 + f * 16 + m * 8, bl = 11 + m * 22;
    const pr = 70 + (1 - m) * 90, pg = 128 - (1 - m) * 10, pb = 62 - (1 - m) * 32, k = Math.min(1, p * 1.1);
    img.data[i * 4] = r + (pr - r) * k;
    img.data[i * 4 + 1] = gr + (pg - gr) * k;
    img.data[i * 4 + 2] = bl + (pb - bl) * k;
    img.data[i * 4 + 3] = 255;
  }
  tg.putImageData(img, 0, 0);
}

// Body plans, drawn facing +x. Grazers are rounded, hunters spiky.
function body(g, shape, s) {
  g.beginPath();
  switch (shape) {
    case 'blob': g.ellipse(0, 0, s * 0.9, s * 0.65, 0, 0, Math.PI * 2); break;
    case 'teardrop': g.moveTo(s, 0); g.quadraticCurveTo(-s * 0.2, s * 0.95, -s * 0.8, 0); g.quadraticCurveTo(-s * 0.2, -s * 0.95, s, 0); break;
    case 'crescent': g.arc(0, 0, s * 0.85, 0.9, -0.9 + Math.PI * 2); g.arc(s * 0.45, 0, s * 0.6, -1.6, 1.6, true); break;
    case 'ring': g.arc(0, 0, s * 0.8, 0, Math.PI * 2); g.moveTo(s * 0.4, 0); g.arc(0, 0, s * 0.4, 0, Math.PI * 2, true); break;
    case 'dart': g.moveTo(s * 1.2, 0); g.lineTo(-s * 0.6, s * 0.5); g.lineTo(-s * 0.15, 0); g.lineTo(-s * 0.6, -s * 0.5); break;
    case 'star': for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.38 : s * 1.05, q = i * Math.PI / 4; g.lineTo(Math.cos(q) * r, Math.sin(q) * r); } break;
    case 'spindle': g.moveTo(s * 1.5, 0); g.lineTo(0, s * 0.35); g.lineTo(-s * 1.1, 0); g.lineTo(0, -s * 0.35); break;
    case 'kraken': // a rounded spearhead, point forward
      g.moveTo(s * 0.95, -s * 0.12); g.quadraticCurveTo(s * 1.15, 0, s * 0.95, s * 0.12);
      g.lineTo(-s * 0.4, s * 0.64); g.quadraticCurveTo(-s * 0.78, s * 0.74, -s * 0.72, s * 0.34);
      g.lineTo(-s * 0.72, -s * 0.34); g.quadraticCurveTo(-s * 0.78, -s * 0.74, -s * 0.4, -s * 0.64); break;
    case 'serpent': g.ellipse(s * 0.2, 0, s * 0.75, s * 0.55, 0, 0, Math.PI * 2); g.moveTo(s * 0.95, 0); g.lineTo(s * 0.55, s * 0.18); g.lineTo(s * 0.55, -s * 0.18); break;
    case 'fang': g.moveTo(s * 1.3, 0); g.quadraticCurveTo(0, s * 1.1, -s * 0.8, s * 0.55); g.lineTo(-s * 0.3, 0); g.quadraticCurveTo(0, -s * 0.45, s * 1.3, 0); break;
    default: g.moveTo(s, 0); g.lineTo(-s * 0.7, s * 0.55); g.lineTo(-s * 0.7, -s * 0.55); // triangle
  }
  g.closePath();
  g.fill('evenodd');
}

// A small portrait of a species, for the Life list.
function portrait(sp) {
  const c = document.createElement('canvas'), k = 2;
  c.width = c.height = 22 * k;
  const pg = c.getContext('2d');
  pg.scale(k, k); pg.translate(11, 11);
  if (sp.mark === 'glow') { pg.fillStyle = `hsla(${sp.hue} 85% 60% / .25)`; pg.beginPath(); pg.arc(0, 0, 10, 0, Math.PI * 2); pg.fill(); }
  if (sp.mark === 'trail') { pg.strokeStyle = `hsla(${sp.hue} 70% 65% / .6)`; pg.lineWidth = 1.2; pg.beginPath(); pg.moveTo(-3, 0); pg.lineTo(-10, 0); pg.stroke(); }
  const look = lookOf(sp);
  pg.fillStyle = `hsl(${sp.hue} ${look.s}% ${50 + look.l}%)`;
  body(pg, sp.shape, 6 * (sp.scale ?? 1));
  marking(pg, look.pat, 6 * (sp.scale ?? 1), sp.hue);
  return c.toDataURL();
}

const lerpWrap = (a, b, t, m) => Math.abs(b - a) > m / 2 ? b : a + (b - a) * t;
const lerpAngle = (a, b, t) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; };

function draw() {
  requestAnimationFrame(draw);
  if (!meta || !cur) return;
  g.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  g.imageSmoothingEnabled = true;
  g.drawImage(terrainCanvas, 0, 0, meta.W, meta.H);
  g.imageSmoothingEnabled = false; // reef keeps its hard, branching edges
  g.drawImage(reefCanvas, 0, 0, meta.W, meta.H);
  g.imageSmoothingEnabled = true;

  for (let i = 0; i < corpses.length; i += 4) {
    const x = corpses[i], y = corpses[i + 1], age = corpses[i + 2], eaten = corpses[i + 3];
    g.fillStyle = eaten ? `rgba(150,50,40,${0.6 * (1 - age)})` : `rgba(170,170,150,${0.35 * (1 - age)})`;
    g.beginPath(); g.arc(x, y, eaten ? 2.5 : 1.8, 0, Math.PI * 2); g.fill();
  }

  // Eggs: a glowing shell, warming from gold to red as it nears hatching, with slow rings spreading from it.
  for (let i = 0; i < eggs.length; i += 4) {
    const x = eggs[i], y = eggs[i + 1], p = eggs[i + 2], t = performance.now(), r = 9 + 2 * Math.sin(t * 0.003), hue = 45 - p * 45;
    for (let k = 0; k < 2; k++) { const u = ((t / 1600) + k / 2) % 1; g.strokeStyle = `hsla(${hue} 90% 65% / ${0.6 * (1 - u)})`; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, r + u * 26, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = `hsl(${hue} 85% ${68 - p * 15}%)`; g.beginPath(); g.ellipse(x, y, r, r * 1.3, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1; g.stroke();
  }

  // Interpolate between the last two frames so 15 updates/s look smooth at 60fps.
  const now = performance.now(), t = Math.min(1, (now - recvAt) / frameMs);
  for (const [id, c] of cur) {
    const sp = species[c.s];
    if (!sp) continue;
    const p = prev?.get(id);
    const x = p ? lerpWrap(p.x, c.x, t, meta.W) : c.x, y = p ? lerpWrap(p.y, c.y, t, meta.H) : c.y;
    const a = p ? lerpAngle(p.a, c.a, t) : c.a;
    let s = Math.max(4, c.z); // every body is drawn at its own inherited size, but never too small to see
    if (sp.mark === 'pulse') s *= 1 + 0.22 * Math.sin(now * 0.006 + id);
    // A heartbeat: every body throbs at its own heart rate (small ones flutter, big ones plod, sprinters race).
    s *= 1 + 0.07 * Math.max(0, Math.sin(now * 0.009 * (c.p ?? 1) + id)) ** 6;
    if (sp.shape === 'serpent') {
      // The body trails behind the head along the exact path it took (like the snake game), seven of its sizes long.
      const t = trails.get(id) ?? [], want = s * 7;
      let len = 0, px = x, py = y;
      g.globalAlpha = highlight && sp.name !== highlight ? 0.12 : 1;
      for (let j = t.length - 1; j >= 0 && len < want; j--) {
        let dx = t[j].x - px, dy = t[j].y - py;
        if (Math.abs(dx) > meta.W / 2 || Math.abs(dy) > meta.H / 2) break; // wrapped across the edge
        len += Math.hypot(dx, dy);
        const k = 1 - len / want;
        g.fillStyle = `hsl(${c.h} 55% ${34 + 18 * k}%)`;
        const rr = Math.max(1.2, s * 0.4 * (0.3 + 0.7 * k)); // segments, slimmer than the head
        g.beginPath(); g.roundRect(t[j].x - rr, t[j].y - rr, rr * 2, rr * 2, rr * 0.6); g.fill();
        px = t[j].x; py = t[j].y;
      }
      g.globalAlpha = 1;
    }
    g.save(); g.translate(x, y); g.rotate(a);
    g.globalAlpha = highlight && sp.name !== highlight ? 0.12 : 1;
    if (sp.mark === 'glow') { g.fillStyle = `hsla(${c.h} 85% 60% / .2)`; g.beginPath(); g.arc(0, 0, s * 1.9, 0, Math.PI * 2); g.fill(); }
    if (sp.mark === 'trail') { g.strokeStyle = `hsla(${c.h} 70% 65% / .45)`; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-s * 0.6, 0); g.lineTo(-s * 2.8, 0); g.stroke(); }
    // A sprint leaves speed lines; legs stretch the body along its heading (long and thin = fast, short and round = slow).
    if (c.b & 4) { g.strokeStyle = `hsla(${c.h} 60% 80% / .55)`; g.lineWidth = 0.8; g.beginPath();
      for (const o of [-0.45, 0.45]) { g.moveTo(-s * 0.9, o * s); g.lineTo(-s * 2.4, o * s); } g.stroke(); }
    const look = lookOf(sp);
    g.fillStyle = c.b & 1 ? '#4a4a4a' : `hsl(${c.h} ${look.s}% ${40 + Math.min(1, c.e) * 28 + look.l}%)`;
    // Dormant giant: pale, and breathing slowly (a gentle swell of its body).
    if (c.b & 32) { g.fillStyle = `hsl(${c.h} 18% 82%)`; s *= 1 + 0.08 * Math.sin(now * 0.0018); }
    // Armour bristles: spikes around the body, longer the more armoured it is.
    if (c.r > 0.08) { g.strokeStyle = `hsla(${c.h} 30% 75% / .8)`; g.lineWidth = 0.7; g.beginPath();
      for (let j = 0; j < 7; j++) { const t = j / 7 * Math.PI * 2; g.moveTo(Math.cos(t) * s * 0.8, Math.sin(t) * s * 0.8); g.lineTo(Math.cos(t) * s * (0.8 + c.r), Math.sin(t) * s * (0.8 + c.r)); }
      g.stroke(); }
    if (sp.shape === 'kraken') {
      // Desperate (shoving through reef toward prey): a flickering red halo of jagged spikes, and thrashing tentacles.
      const frantic = c.b & 8, asleep = c.b & 32;
      if (c.b & 64) { const u = (now % 900) / 900; g.strokeStyle = `hsla(10 90% 60% / ${0.8 * (1 - u)})`; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, s * (1.2 + u * 3.5), 0, Math.PI * 2); g.stroke(); } // rage shockwave
      if (asleep) g.globalAlpha = 0.45; // dormant: dim and still
      if (frantic) {
        g.strokeStyle = `hsla(0 90% 55% / ${0.45 + 0.35 * Math.sin(now * 0.03)})`; g.lineWidth = 1.4; g.beginPath();
        for (let j = 0; j < 14; j++) { const q = j / 14 * Math.PI * 2 + now * 0.004, r = s * (j % 2 ? 0.95 : 1.35 + 0.2 * Math.sin(now * 0.05 + j)); g.lineTo(Math.cos(q) * r + s * 0.15, Math.sin(q) * r); }
        g.closePath(); g.stroke();
      }
      // Six tentacles trail behind the mantle, waving; each tapers to a fine tip.
      for (let j = 0; j < 6; j++) {
        const base = (j - 2.5) * 0.28, len = s * (2.2 + 0.3 * Math.sin(j * 1.7));
        g.strokeStyle = `hsla(${c.h} 55% ${42 + j * 3}% / .85)`;
        let px = -s * 0.35, py = Math.sin(base) * s * 0.55;
        for (let k = 1; k <= 8; k++) {
          const u = k / 8, wave = asleep ? Math.sin(j * 1.3 + u * 4) * s * 0.15 * u : Math.sin(now * (frantic ? 0.013 : 0.004) + j * 1.3 + u * 4) * s * (frantic ? 0.65 : 0.35) * u;
          const nx = -s * 0.35 - len * u, ny = Math.sin(base) * s * (0.55 + u * 0.6) + wave;
          g.lineWidth = Math.max(0.6, s * 0.16 * (1 - u)); g.beginPath(); g.moveTo(px, py); g.lineTo(nx, ny); g.stroke();
          px = nx; py = ny;
        }
      }
    }
    const legs = c.l ?? 1; g.scale(legs, (1 + 0.35 * (c.f ?? 0)) / Math.sqrt(legs)); // fat rounds the body out
    body(g, sp.shape, s);
    g.strokeStyle = 'rgba(235,240,230,.35)'; g.lineWidth = 0.6; g.stroke(); // a faint outline against any soil
    if (!(c.b & 33)) marking(g, look.pat, s, c.h); // not on the broken or the dormant
    if (c.b & 2) { g.strokeStyle = `hsla(${c.h} 80% 75% / .45)`; g.lineWidth = 0.8; g.beginPath(); g.arc(0, 0, s + 2.5, 0, Math.PI * 2); g.stroke(); }
    // Infested (flystrike): dark specks crawling on the body.
    if (c.b & 16) { g.fillStyle = 'rgba(20,15,10,.85)'; for (let j = 0; j < 5; j++) { const q = j * 1.3 + now * 0.002 * (j % 2 ? 1 : -1); g.beginPath(); g.arc(Math.cos(q) * s * 0.5, Math.sin(q) * s * 0.4, Math.max(0.7, s * 0.12), 0, Math.PI * 2); g.fill(); } }
    g.restore();
  }

  g.fillStyle = `rgba(70,110,160,${Math.max(0, rain - 0.5) * 0.06})`;
  g.fillRect(0, 0, meta.W, meta.H);
}
requestAnimationFrame(draw);

function renderClock() {
  const day = Math.floor(tick / meta.TICKS_PER_DAY) + 1;
  const left = Math.ceil((meta.SEASON_TICKS - tick % meta.SEASON_TICKS) / (tickRate || meta.TICKS_PER_SEC)); // at the measured speed
  const sky = rain > 0.75 ? 'storms' : rain > 0.55 ? 'rain' : rain > 0.35 ? 'overcast' : rain > 0.2 ? 'dry' : 'drought';
  const era = climate > 0.66 ? 'wet era' : climate < 0.34 ? 'dry era' : climate > 0.5 ? 'wetting era' : 'drying era';
  $('clock').textContent = `season ${season} · day ${day} · ${sky} · ${era} · season ends in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (tick % 30 === 0) renderSpecies();
  else for (const el of document.querySelectorAll('[data-count]')) el.textContent = counts()[el.dataset.count] ?? 0;
}

function counts() {
  const n = {};
  if (cur) for (const c of cur.values()) { const name = species[c.s]?.name; if (name) n[name] = (n[name] ?? 0) + 1; }
  return n;
}

// Living species, most numerous first; each opens to show its lineage and the code it runs on.
function renderSpecies(force) {
  const list = $('species');
  if (!force && list.matches(':hover')) return; // don't reshuffle under the pointer
  const n = counts(), open = new Set([...list.querySelectorAll('details[open]')].map(d => d.dataset.name));
  const living = species.filter(s => s.extinct === null && !s.waiting).sort((a, b) => (n[b.name] ?? 0) - (n[a.name] ?? 0));
  // Eggs waiting to hatch are listed too, so they can be found.
  const eggRows = [];
  for (let i = 0; i < eggs.length; i += 4) {
    const sp = species[eggs[i + 3]];
    eggRows.push(`<div class="egg">egg of the ${sp?.name ?? '?'}s · ${Math.round(eggs[i + 2] * 100)}% to hatching · at (${eggs[i]}, ${eggs[i + 1]})</div>`);
  }
  const total = cur ? cur.size : 0;
  const head = `<div class="total">${total.toLocaleString('en')} creatures alive${cap ? ` · room for ${cap.toLocaleString('en')}` : ''} · ${living.length} species</div>`;
  list.innerHTML = head + eggRows.join('') + living.map(sp => {
    const st = stats[sp.name] ?? {};
    const origin = sp.variant ? `a variant of the ${sp.parent}s (still breeds with them), season ${sp.born}` : sp.parent ? `from the ${sp.parent}s, season ${sp.born}` : 'original';
    const fresh = sp.parent && sp.born === season ? ' · <span class="new">first season</span>' : '';
    const tr = traits[sp.name] ?? {};
    const deeds = `kills ${st.kills ?? 0} · eaten ${st.eaten ?? 0}`;
    const progress = Math.max(0, (records[sp.name]?.generation ?? 0) - (sp.lastBranchGen ?? 0));
    return `<details data-name="${sp.name}"${open.has(sp.name) ? ' open' : ''}><summary>
      <img class="portrait" src="${portraitOf(sp)}" alt=""><span>${sp.name}s <span class="dim">${sp.lineage ?? ''} · <span class="role-${tr.role}">${tr.label ?? tr.role ?? ''}</span>${sp.variant ? ' · variant' : ''}</span></span><b data-count="${sp.name}">${n[sp.name] ?? 0}</b>
      <small>${tr.food ? 'lives on: ' + Object.entries(tr.food).filter(([, v]) => v >= 0.05).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join(' · ') + '<br>' : ''}${dietBreakdown(tr)}${origin}${fresh} · next branch ${progress}/${meta.GENERATIONS_PER_MUTATION} generations<br>
      size ${tr.size ?? '?'} · gut ${tr.gut ?? '?'} · legs ${tr.legs ?? '?'} · fat ${tr.fat !== undefined ? Math.round(tr.fat * 100) + '%' : '?'} · stamina ${tr.wind ?? '?'} · armour ${tr.armor ?? '?'} · toxin ${tr.toxin ?? '?'} · litter ${tr.litter ?? '?'} · maturity ×${tr.mature ?? '?'} · browse ${tr.browse ?? '?'}${tr.role === 'hunter' || tr.role === 'apex' ? ` · gape ×${tr.gape ?? '?'}` : ''}${tr.browsers ? ` (${tr.browsers} browsing)` : ''} · thrift ${tr.thrift ?? '?'} · plasticity ${tr.plastic ?? '?'}${tr.turning ? ` (${tr.turning} turning)` : ''} · trophic level ${tr.tl ?? '?'} · code drifted ${Math.round((sp.drift ?? 0) * 100)}%<br>
      mated ${st.mated ?? 0} · budded ${st.budded ?? 0} · ${deeds} · starved ${st.starved ?? 0}</small></summary>
      <pre>${esc(sp.code ?? '')}</pre></details>`;
  }).join('');
  const dead = species.filter(s => s.extinct !== null && !s.variant), faded = species.filter(s => s.extinct !== null && s.variant), held = species.filter(s => s.waiting);
  $('extinct').innerHTML = (held.length ? `held by the god: ${held.map(s => `${s.name} <span class="dim">${s.lineage}</span>`).join(' ')}<br>` : '') + (dead.length ? `extinct (${dead.length}): ` + dead.slice(-24).reverse().map(s => `<s>${s.name}</s> <span class="dim">${s.lineage ?? ''}</span>`).join(' ') : '')
    + (faded.length ? `<br>variants that faded (${faded.length}): ` + faded.slice(-12).reverse().map(s => `<s>${s.name}</s>`).join(' ') : '');
}

function renderEvents() {
  if (!meta) return setTimeout(renderEvents, 100);
  $('events').innerHTML = events.slice(-40).reverse()
    .map(e => `<li><span>s${Math.floor(e.t / meta.SEASON_TICKS) + 1}</span>${esc(e.text)}</li>`).join('');
}

// Every species as a stacked band, so branching and extinction show as rivers splitting and drying up.
// Time range for both charts: the last 3 seasons, the last 30 (an age), or the whole era. Remembered per browser.
const RANGES = { '3 seasons': 3, '30 seasons': 30, era: Infinity };
let range = '30 seasons';
try { range = localStorage.getItem('range') ?? range; } catch {}
if (!(range in RANGES)) range = '30 seasons';
function shownHistory() {
  if (!meta || !history.length || RANGES[range] === Infinity) return history;
  const from = history.at(-1).t - RANGES[range] * meta.SEASON_TICKS;
  return history.filter(e => e.t >= from);
}
function renderRanges() {
  $('ranges').innerHTML = Object.keys(RANGES).map(r => `<button data-range="${r}" class="${r === range ? 'on' : ''}">${r}</button>`).join('');
}
document.addEventListener('click', e => {
  const r = e.target.closest?.('[data-range]')?.dataset.range;
  if (!r) return;
  range = r;
  try { localStorage.setItem('range', r); } catch {}
  renderRanges();
  drawChart();
});
renderRanges();

// One line per species: how far its code numbers have drifted from the code it was written with.
function drawDrift() {
  const history = shownHistory();
  if (!meta || history.length < 2) return;
  const c = $('drift'), dpr = devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const cg = c.getContext('2d'), w = c.width, h = c.height;
  const t0 = history[0].t, t1 = history.at(-1).t, x = i => (history[i].t - t0) / (t1 - t0 || 1) * w;
  const max = Math.max(0.1, ...history.flatMap(e => Object.values(e.traits ?? {}).map(t => t.drift ?? 0)));
  for (const sp of species) {
    cg.strokeStyle = `hsl(${sp.hue} 60% 55%)`; cg.lineWidth = 1.4 * dpr;
    cg.beginPath();
    let on = false;
    history.forEach((e, i) => {
      const d = e.traits?.[sp.name]?.drift;
      if (d === undefined) { on = false; return; }
      const y = h - d / max * h * 0.92;
      if (on) cg.lineTo(x(i), y); else cg.moveTo(x(i), y);
      on = true;
    });
    cg.stroke();
  }
  cg.fillStyle = css('--ink'); cg.font = `${10 * dpr}px ui-monospace, monospace`;
  cg.fillText(`${Math.round(max * 100)}%`, 2, 11 * dpr);
}

// When a species' members no longer all live the same way, show the split: a bar of bodies by gut
// (green: grazer, amber: both, red: meat only) and how many are mostly grazing, scavenging or hunting.
function dietBreakdown(tr) {
  const [g, m, f] = tr.bodies ?? [0, 0, 0], [eg, ec, ef] = tr.eating ?? [0, 0, 0], total = g + m + f;
  const mixed = [g, m, f].filter(Boolean).length > 1 || [eg, ec, ef].filter(Boolean).length > 1 || tr.turning;
  if (!total || !mixed) return '';
  const pct = v => (v / total * 100).toFixed(1);
  const parts = [eg && `${eg} mostly plants`, ec && `${ec} mostly carrion`, ef && `${ef} mostly live prey`, tr.turning && `${tr.turning} turning`].filter(Boolean).join(' · ');
  return `<span class="diet"><i style="width:${pct(g)}%;background:hsl(120 45% 45%)"></i><i style="width:${pct(m)}%;background:hsl(45 70% 50%)"></i><i style="width:${pct(f)}%;background:hsl(5 60% 50%)"></i></span>`
    + `<span title="gut: plants only ≤ 0.25 · omnivore 0.25–0.75 · meat only ≥ 0.75">guts: ${g} plants only · ${m} omnivore · ${f} meat only</span><br>lately eating: ${parts}<br>`;
}

function drawChart() {
  drawDrift();
  const history = shownHistory();
  $('span').textContent = history.length > 1 ? `days ${Math.floor(history[0].t / meta.TICKS_PER_DAY) + 1}–${Math.floor(history.at(-1).t / meta.TICKS_PER_DAY) + 1}` : '';
  if (!meta || history.length < 2 || !species.length) return;
  const c = $('chart'), dpr = devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const cg = c.getContext('2d'), w = c.width, h = c.height;
  const t0 = history[0].t, t1 = history.at(-1).t, x = i => (history[i].t - t0) / (t1 - t0 || 1) * w;
  const total = e => Object.values(e.pops).reduce((a, b) => a + b, 0);
  const max = Math.max(...history.map(total), 1);
  const base = new Float32Array(history.length);
  for (const sp of species) {
    if (!history.some(e => e.pops[sp.name])) continue;
    cg.fillStyle = `hsl(${sp.hue} 55% ${(traits[sp.name]?.tl ?? 2) >= 2.5 ? 55 : 42}%)`;
    cg.beginPath();
    history.forEach((e, i) => cg.lineTo(x(i), h - (base[i] + (e.pops[sp.name] ?? 0)) / max * h));
    for (let i = history.length - 1; i >= 0; i--) cg.lineTo(x(i), h - base[i] / max * h);
    cg.fill();
    history.forEach((e, i) => { base[i] += e.pops[sp.name] ?? 0; });
  }
  const maxPlants = Math.max(...history.map(e => e.plants), 1);
  cg.strokeStyle = css('--plantline'); cg.lineWidth = dpr;
  cg.beginPath();
  history.forEach((e, i) => cg.lineTo(x(i), h - e.plants / maxPlants * h));
  cg.stroke();
}
</script>
</body>
</html>
