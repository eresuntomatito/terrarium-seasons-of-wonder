<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Terrarium</title>
<style>
  /* Dark is the aquarium at night; light follows the system unless the toggle says otherwise. The world itself stays dark. */
  :root { --bg: #080a09; --fg: #aab6ae; --dim: #56635b; --line: #1a221d; --hi: #d4dfd7; --panel: #0e1210;
          --warm: #c9b77a; --omni: #b8a76a; --hunter: #c98a6e; --apex: #e0605a; --strike: #6a3a32;
          --ink: rgba(170,182,174,.5); --plantline: rgba(160,200,140,.35); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc;
    --warm: #8a6d14; --omni: #7d6a1e; --hunter: #a4502e; --apex: #c0302a; --strike: #c08a80;
    --ink: rgba(60,70,62,.6); --plantline: rgba(70,120,50,.55); color-scheme: light; } }
  :root[data-theme="light"] {
    --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc;
    --warm: #8a6d14; --omni: #7d6a1e; --hunter: #a4502e; --apex: #c0302a; --strike: #c08a80;
    --ink: rgba(60,70,62,.6); --plantline: rgba(70,120,50,.55); color-scheme: light; }
  #head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  #tools { display: flex; gap: 6px; align-items: center; }

  #theme { background: none; cursor: pointer; }
  #theme:hover { color: var(--hi); }

  #zoom button { background: color-mix(in srgb, var(--bg) 82%, transparent); border: 1px solid var(--line); color: var(--dim); font: inherit; padding: 1px 6px; cursor: pointer; }
  #zoom button:hover { color: var(--hi); }
  #zoom .divider { width: 1px; height: 12px; margin: 0 2px; background: var(--line); }
  #xraypanel { position: absolute; bottom: 22px; left: 22px; max-width: calc(100% - 44px); padding: 4px; background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--dim); font-size: 10px; }
  #xraychips { display: flex; gap: 5px; }
  #xraychips button { background: color-mix(in srgb, var(--bg) 82%, transparent); border: 1px solid var(--line); color: var(--dim); font: inherit; padding: 1px 6px; cursor: pointer; }
  #xraychips button.on, #xraychips button:hover { color: var(--hi); border-color: var(--hi); }
  #xraylegend { margin-top: 4px; font-size: 10px; white-space: nowrap; overflow-x: auto; }

  b.stand { color: var(--hi); font-weight: 600; }

  #span { font-size: 10px; margin: -4px 0 4px; }
  * { box-sizing: border-box; }

         display: grid; grid-template-columns: 1fr 340px; }
  main { display: grid; place-items: center; padding: 16px; min-width: 0; position: relative; }
  /* Chronicle pop-ups: news slides up at the bottom of the world view, then fades. */
  #tip { position: absolute; pointer-events: none; background: color-mix(in srgb, var(--bg) 85%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 11px monospace; color: var(--fg); backdrop-filter: blur(4px); max-width: 220px; line-height: 1.4; }
  #tip b { color: var(--hi); }
  #tip .states { color: var(--warm); }
  #toasts { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: min(80%, 620px);
            display: flex; flex-direction: column; gap: 6px; pointer-events: none; align-items: center; }
  .toast { background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--fg); border: 1px solid var(--line);

  #world { width: 1920px; max-width: min(100%, calc(150vh - 51px)); max-height: calc(100vh - 32px); height: auto; aspect-ratio: 3 / 2; box-sizing: content-box; border: 1px solid var(--line); touch-action: none; }

  h1 { font-size: 13px; font-weight: normal; letter-spacing: .2em; text-transform: uppercase; margin: 0; color: var(--hi); }
  h2 { font-size: 11px; font-weight: normal; letter-spacing: .15em; text-transform: uppercase; margin: 0 0 6px; color: var(--dim); }
  .dim { color: var(--dim); }
  #god { color: var(--dim); min-height: 1.5em; }
  #god:empty { display: none; }
  #god.thinking { color: var(--warm); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .45; } }
  details { border-top: 1px solid var(--line); padding: 4px 0; }
  summary { display: grid; grid-template-columns: 22px 1fr auto; gap: 1px 6px; align-items: center; cursor: pointer; list-style: none; }
  .portrait { width: 22px; height: 22px; }
  summary::-webkit-details-marker { display: none; }
  summary > i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  summary b { font-weight: normal; color: var(--hi); font-variant-numeric: tabular-nums; }
  summary small { grid-column: 1 / 4; color: var(--fg); font-size: 10px; line-height: 1.3; }
  summary .identity { grid-column: 2 / 4; font-size: 11px; line-height: 1.3; }
  .speciesbody { padding-top: 6px; font-size: 10px; overflow-wrap: anywhere; }
  #clock { overflow-wrap: anywhere; }
  summary > span, summary small { min-width: 0; overflow-wrap: anywhere; }
  details:hover summary span { color: var(--hi); }
  .new { color: var(--warm); }
  .role-omnivore { color: var(--omni); } .role-hunter { color: var(--hunter); } .role-apex { color: var(--apex); font-weight: bold; }
  pre { margin: 6px 0 4px; padding: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 10.5px; line-height: 1.4;
        max-height: 320px; overflow: auto; white-space: pre; }
  #extinct { color: var(--dim); overflow-wrap: anywhere; }
  .total { padding: 2px 0 6px; font-weight: 700; color: var(--dim); }
  .egg { padding: 4px 0; color: hsl(35 85% 55%); font-weight: 600; }

  #extinct s { text-decoration-color: var(--strike); }
  .lenses { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0 6px; }
  .lenses button { font:inherit; font-size:10px; padding:2px 5px; border:1px solid var(--line); border-radius:10px; background:none; color:var(--dim); cursor:pointer; }
  .lenses button.on { color:var(--hi); border-color:var(--dim); } .lenses button:disabled { opacity:.4; cursor:default; }
  .niche { display:grid; align-items:center; width:100%; margin:3px 0 6px; font-size:9px; }
  .niche .place { font-size:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; color:var(--dim); }
  .niche .nicherole { height:16px; line-height:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nicheabsence { color:var(--dim); font-size:9px; line-height:1.5; margin:2px 0 6px; } .niche button { display:flex; align-items:center; justify-content:center; height:16px; min-width:0; padding:0; border:0; color:var(--dim); background:none; cursor:crosshair; }
  .niche i { display:block; border-radius:50%; } .roleheading { font-size:10px; color:var(--dim); margin:8px 0 2px; }
  .popbar { display:block; grid-column:1 / 4; height:2px; margin:2px 0 1px; background:var(--line); } .popbar i { display:block; height:2px; }
  #ecotip { position:fixed; z-index:20; max-width:min(320px,calc(100vw - 16px)); padding:6px 8px; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:4px; font-size:11px; pointer-events:none; overflow-wrap:anywhere; }
  #chart { width: 100%; height: 120px; display: block; }
  .diet { display: flex; height: 4px; margin: 3px 0 2px; background: var(--line); }
  .diet i { display: block; height: 100%; }
  #events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #events li span { color: var(--dim); margin-right: 6px; }
  a { color: var(--dim); }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main><canvas id="world"></canvas><div id="zoom"><button id="xraybtn" title="X-ray the land (x)" aria-pressed="false">X-ray</button><span class="divider" aria-hidden="true"></span><button id="zoomin" aria-label="Zoom in">+</button><button id="zoomout" aria-label="Zoom out">−</button><button id="zoomfit" title="recenter: whole world, original framing (0)">fit</button><span id="zoomlevel">1.0×</span><span id="following"></span></div><div id="xraypanel" hidden><div id="xraychips"><button data-view="height">Height</button><button data-view="rock">Rock</button><button data-view="water">Water</button><button data-view="barriers">Barriers</button></div><div id="xraylegend"></div></div><div id="toasts"></div><div id="tip" hidden></div></main>
<aside>
  <div><div id="head"><h1>The Terrarium</h1><nav id="tools"><a id="wikilink" href="/reports.html?section=wiki" title="the world's wiki: guides, concepts, species and history">wiki</a><a id="reportslink" href="/reports.html" title="status reports of the world">reports<span id="reportsbadge" hidden></span></a><button id="theme" title="theme: auto, light, dark">auto</button></nav></div><div class="dim" id="clock">connecting…</div><div id="weatherwrap"><div id="weather" tabindex="0" aria-controls="climatebox" aria-expanded="false">Waiting for the weather.</div><div id="climatebox" hidden title="the climate: wet ↔ dry across, cold ↔ hot up and down; the dot is now, the line the last 30 seasons, the bar the span from the coldest ground (the peak, or the north) to the warmest (the lowlands, or the south)"><canvas id="dial" width="264" height="264"></canvas><div id="climatetext" class="dim"></div></div></div><div id="god"></div></div>
  <section><h2>History <span id="ranges"></span></h2><div class="dim" id="span"></div><canvas id="chart"></canvas></section>
  <section><h2>Life</h2><div id="species"></div><p id="extinct"></p></section>
  <section><h2>Chronicle</h2><ul id="events"></ul></section>
  <footer><a href="/miniature.html">god in miniature</a></footer>
</aside>
<div id="ecotip" role="tooltip" hidden></div>

<script>
const $ = id => document.getElementById(id);

try { showXray=localStorage.getItem('xray')==='1';const v=localStorage.getItem('xrayView');if(xrayViews.includes(v))xrayView=v; } catch {}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
// Theme: auto (system), light or dark, remembered per browser. Charts redraw in the new ink.
{
  const order = ['auto', 'light', 'dark'];
  let theme = 'auto';
  try { theme = localStorage.getItem('theme') ?? 'auto'; } catch {}
  const apply = redraw => {
    if (theme === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
    $('theme').textContent = theme;
    if (redraw) drawChart(); // not on the first call: the charts' state is not declared yet
  };
  // Unread status reports: a badge on the 'reports' link, checked every minute.
  const reportsAlert = () => fetch('/api/reports').then(r => r.json()).then(list => {
    const n = list.filter(r => !r.read).length;
    $('reportsbadge').hidden = !n; $('reportsbadge').textContent = n; $('reportslink').classList.toggle('unread', !!n);
    $('reportslink').title = n ? `${n} new status report${n > 1 ? 's' : ''} not read yet` : 'status reports of the world';
  }).catch(() => {});
  reportsAlert(); setInterval(reportsAlert, 60000);
  $('theme').onclick = () => { theme = order[(order.indexOf(theme) + 1) % 3]; try { localStorage.setItem('theme', theme); } catch {} apply(true); };
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => apply(true));
  apply(false);
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

const terrainCanvas = document.createElement('canvas'), tg = terrainCanvas.getContext('2d');
const reefCanvas = document.createElement('canvas'), rg = reefCanvas.getContext('2d');
let eggs = [], cap = null;
let quakeSeen = null, quakeAt = 0; // the last earthquake and when the viewer saw it
let climate = 0.5, grassFood = 1, tickRate = 0, lastTick = null, lastTickAt = 0;
let divide = null; // the next great divide: { name, ticks } or null

let climateNow = null; // { rows: temperature by band of rows (0 cold … 1 hot), era } — sent every 300 ticks once the climate is on
const speedLog = []; // [tick, ms] of recent frames, for the measured speed
const trails = new Map();
const headings = new Map(); // id → the heading drawn, turned smoothly toward where the body really goes
const SCALE = 2;
let meta, frameMs, cur = null, prev = null, recvAt = 0, rain = 0, tick = 0, season = 1;
let species = [], history = [], events = [], stats = {}, records = {}, traits = {}, corpses = [], highlight = null;
// The camera eases toward a wrapped target; zoom keeps its chosen world point under the pointer.
const camera = { z: 1, cx: 0, cy: 0 }, target = { ...camera }, pointers = new Map();

// Hover shares the click's nearest-body test.
const tip = $('tip'); let hovered = null, hoverPoint = null;
function hideTip() { hovered = null; hoverPoint = null; tip.hidden = true; }

}
function placeTip() { if (!hoverPoint || tip.hidden) return; const main = tip.parentElement, r = main.getBoundingClientRect(), x = hoverPoint.x - r.left - main.clientLeft, y = hoverPoint.y - r.top - main.clientTop, w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = `${Math.max(0, Math.min(main.clientWidth - w, x + 14 + w > main.clientWidth ? x - w - 14 : x + 14))}px`; tip.style.top = `${Math.max(0, Math.min(main.clientHeight - h, y + 14 + h > main.clientHeight ? y - h - 14 : y + 14))}px`; }

}
function refreshTip() {

}
function groundTip(){
 if(!meta||!hoverPoint)return;const w=worldPoint(canvasPoint({clientX:hoverPoint.x,clientY:hoverPoint.y})),i=cellOf(w.x,w.y),x=i%meta.GW,y=Math.floor(i/meta.GW),E=worldInputs.elev3??worldInputs.elev2??worldInputs.elev;if(!E){hideTip();return;}

}
setInterval(refreshTip, 200);
canvas.addEventListener('pointerleave', hideTip);
const wrap = (v, period) => ((v % period) + period) % period;
const wrappedDelta = (from, to, period) => wrap(to - from + period / 2, period) - period / 2;

// How each species stands apart from its kin (living species of the same line, never the unique giants): per trait,
// how far it sits from the others, in units of the trait's spread across the family (z); the 2–3 strongest standouts
// as words; a distinctness score (mean |z|); and its nearest relative, with how far apart (share of each trait's range,
// as in the ancestry measure).
const KIN_TRAITS = [['size', 'larger', 'smaller', 'log'], ['gut', 'meat-leaning', 'grass-adapted', 1], ['legs', 'long-legged', 'short-legged', 1],
  ['wind', 'long-winded', 'short-winded', 1], ['armor', 'shelled', 'soft', 1], ['toxin', 'toxic', 'mild', 1], ['litter', 'large litters', 'small litters', 2],
  ['mature', 'late-maturing', 'early-maturing', 2], ['browse', 'browsing', 'grass-only', 1], ['gape', 'wide-mouthed', 'narrow-mouthed', 1],
  ['resist', 'poison-resistant', 'unresistant', 1], ['eyes', 'sharp-eyed', 'dim-eyed', 1],
  ['decomp', 'dung-eating', 'no dung-eaters', 1], ['parasitism', 'parasitic', 'not parasitic', 1], ['swim', 'swimmers', 'non-swimmers', 1], ['coat', 'thick-coated', 'thin-coated', 1], ['water', 'water-thrifty', 'thirsty', 1]];

const KIN_WORDS = {

  wind: ['more stamina', 'less stamina'], armor: ['more armour', 'less armour'], toxin: ['more toxin', 'less toxin'],
  litter: ['larger litters', 'smaller litters'], mature: ['later maturity', 'earlier maturity'], browse: ['more browsing', 'less browsing'],
  gape: ['a wider mouth', 'a narrower mouth'], resist: ['stronger resistance', 'weaker resistance'], eyes: ['sharper eyes', 'weaker eyes'],
  decomp: ['more dung in its diet', 'less dung in its diet'], swim: ['more swimming', 'less swimming'], parasitism: ['more parasitism', 'less parasitism'],
  coat: ['a thicker coat', 'a thinner coat'], water: ['more water thrift', 'less water thrift']

function trendPoint(name) {

  const list = $('species');
  if(!meta)return;updatePlaces();
  if (!force && list.matches(':hover')) return; // don't reshuffle under the pointer
  const n = counts(), open = new Set([...list.querySelectorAll('details[open]')].map(d => d.dataset.name));
  const eggTimes=new Map();
  for(let i=0;i<eggs.length;i+=4){const name=species[eggs[i+3]]?.name;if(name){const seconds=Math.max(0,Math.ceil((1-eggs[i+2])*meta.SEASON_TICKS/(tickRate||meta.TICKS_PER_SEC)));eggTimes.set(name,Math.min(eggTimes.get(name)??Infinity,seconds));}}
  const living = species.filter(s => s.extinct === null && !s.waiting && ((n[s.name]??0)>0||eggTimes.has(s.name)));
  // Eggs waiting to hatch are listed too, so they can be found.
  const eggRows = [];
  for (let i = 0; i < eggs.length; i += 4) {
    const sp = species[eggs[i + 3]];
    // An egg takes one season (eggTicks = SEASON_TICKS) from laying to hatching; time left at the measured speed.
    const eggLeft = Math.max(0, Math.ceil((1 - eggs[i + 2]) * meta.SEASON_TICKS / (tickRate || meta.TICKS_PER_SEC)));
    eggRows.push(`<div class="egg">egg of the ${sp?.name ?? '?'}s · ${Math.round(eggs[i + 2] * 100)}% to hatching · hatches in ${Math.floor(eggLeft / 60)}:${String(eggLeft % 60).padStart(2, '0')} · at (${eggs[i]}, ${eggs[i + 1]})</div>`);
  }
  const total = cur ? cur.size : 0;
  const head = `<div class="total">${total.toLocaleString('en')} creatures alive${cap ? ` · room for ${cap.toLocaleString('en')}` : ''} · ${living.length} species</div>`;
  const kin = kinship(living);
  const family=familyOrder(living,species),maxPop=Math.max(1,...Object.values(n));
  const ordered=lifeLens==='Family'?family:ECO_ROLES.flatMap(r=>family.filter(({sp})=>ecoRole(sp)===r));
  const rows=new Map(ordered.map(({sp,depth,parent})=>{ 
    const st = stats[sp.name] ?? {};
    const kn = kin[sp.name], z = kn?.z ?? {};
    // A trait that sets it apart from its kin is shown in bold with ▲ (above them) or ▼ (below).
    const mark = (k, text) => Math.abs(z[k] ?? 0) >= 1 ? `<b class="stand">${text} ${z[k] > 0 ? '▲' : '▼'}</b>` : text;
    const origin = sp.variant ? `a variant of the ${sp.parent}s (still breeds with them), season ${sp.born}` : sp.parent ? `from the ${sp.parent}s, season ${sp.born}` : 'original';
    const fresh = sp.parent && sp.born === season ? ' · <span class="new">first season</span>' : '';
    const tr = traits[sp.name] ?? {};
    const deeds = `kills ${st.kills ?? 0} · eaten ${st.eaten ?? 0}`;
    const story = speciesStory(sp, z, n[sp.name] ?? 0);
    if(!(n[sp.name]>0)&&eggTimes.has(sp.name)){const secs=eggTimes.get(sp.name);story.text=`only eggs, hatching in ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;story.arrow='';}
    const drift = founderDrift(sp.name);
    const food = Object.entries(tr.food ?? {}).sort((a, b) => b[1] - a[1])[0]?.[0];
    const progress = Math.max(0, (records[sp.name]?.generation ?? 0) - (sp.lastBranchGen ?? 0));
    if(lifeLens==='Family'&&sp.parent&&living.some(s=>s.name===sp.parent))story.text=`split from the ${sp.parent}s in s${sp.born} · ${story.text}`;
    return [sp.name,`<details style="margin-left:${lifeLens==='Family'?Math.min(depth,4)*10:0}px" data-name="${sp.name}"${open.has(sp.name) ? ' open' : ''}><summary>
      <img class="portrait" src="${portraitOf(sp)}" alt=""><span class="identity">${sp.name}s <b data-count="${sp.name}">${n[sp.name] ?? 0}</b> ${story.arrow} <span class="dim"><span class="role-${tr.role}">${tr.label ?? tr.role ?? ''}</span>${food ? ' · lives on ' + food : ''}</span></span>
      <span class="popbar"><i data-popbar="${sp.name}" style="width:${(n[sp.name]??0)/maxPop*100}%;background:hsl(${sp.hue} 55% 50%)"></i></span><small>${esc(story.text)}</small></summary><div class="speciesbody">
      <span class="dim">${sp.lineage ?? ''}${sideFoods(tr)}${sp.variant ? ' · variant' : ''}</span><br>
      ${tr.food ? 'lives on: ' + Object.entries(tr.food).filter(([, v]) => v >= 0.05).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join(' · ') + '<br>' : ''}${dietBreakdown(tr)}${origin}${fresh} · next branch ${progress}/${meta.GENERATIONS_PER_MUTATION} generations<br>
      ${tr.minds?.length ? `hidden minds: ${tr.minds.map(m => `${m.count} carry “${m.what}”`).join(' · ')} <span class="dim">(a kind of its own at 15)</span><br>` : ''}
      ${kn ? `<i class="portraitline">${kn.portrait}</i> · distinct ${kn.distinct.toFixed(1)} · nearest: ${kn.nearest[0]}s (${Math.round(kn.nearest[1] * 100)}% apart)<br>` : ''}
      ${mark('size', `size ${tr.size ?? '?'}`)} · ${mark('gut', `gut ${tr.gut ?? '?'}`)} · ${mark('legs', `legs ${tr.legs ?? '?'}`)} · fat ${tr.fat !== undefined ? Math.round(tr.fat * 100) + '%' : '?'} · ${mark('wind', `stamina ${tr.wind ?? '?'}`)} · ${mark('armor', `armour ${tr.armor ?? '?'}`)} · ${mark('toxin', `toxin ${tr.toxin ?? '?'}`)} · ${mark('litter', `litter ${tr.litter ?? '?'}`)} · ${mark('mature', `maturity ×${tr.mature ?? '?'}`)} · ${mark('browse', `browse ${tr.browse ?? '?'}`)} · ${mark('gape', `gape ×${tr.gape ?? '?'}`)} · ${mark('resist', `resistance ${tr.resist ?? '?'}`)} · ${mark('eyes', `eyes ${tr.eyes ?? '?'}`)}${tr.browsers ? ` (${tr.browsers} browsing)` : ''}${tr.decomp !== undefined ? ` · ${mark('decomp', `decomposer ${tr.decomp}`)} · ${mark('swim', `swim ${tr.swim ?? 0}`)} · ${mark('parasitism', `parasite ${tr.parasitism}`)} · ${mark('coat', `coat ${tr.coat}`)} · ${mark('water', `water thrift ${tr.water}`)}` : ''} · thrift ${tr.thrift ?? '?'} · plasticity ${tr.plastic ?? '?'}${tr.turning ? ` (${tr.turning} turning)` : ''} · trophic level ${tr.tl ?? '?'}${sp.driftRoot !== undefined && sp.root && sp.root !== sp.name ? ` · from the ${sp.root}s: code ${Math.round(sp.driftRoot * 100)}%, body ${Math.round((sp.bodyRoot ?? 0) * 100)}% (since its split: code ${Math.round((sp.drift ?? 0) * 100)}%)` : ` · code drifted ${Math.round((sp.drift ?? 0) * 100)}%${sp.bodyRoot !== undefined ? `, body ${Math.round(sp.bodyRoot * 100)}%` : ''}`}<br>
      mated ${st.mated ?? 0} · budded ${st.budded ?? 0} · ${deeds} · starved ${st.starved ?? 0}<br>
      ${drift.code !== undefined && drift.body !== undefined ? `drifted ${Math.round(drift.code * 100)}% in code and ${Math.round(drift.body * 100)}% in body from its line's founder` : 'founder drift: ' + (drift.code !== undefined ? `code ${Math.round(drift.code * 100)}%` : 'code unrecorded') + ' · ' + (drift.body !== undefined ? `body ${Math.round(drift.body * 100)}%` : 'body unrecorded')}</div>
      <pre>${esc(sp.code ?? '')}</pre></details>`];
  }));
  list.innerHTML=head+nicheGrid(living)+lensChips()+eggRows.join('')+(lifeLens==='Family'?ordered.map(({sp})=>rows.get(sp.name)).join(''):ECO_ROLES.filter(r=>living.some(sp=>ecoRole(sp)===r)).map(r=>`<div class="roleheading">${rolePlural(r)}</div>`+ordered.filter(({sp})=>ecoRole(sp)===r).map(({sp})=>rows.get(sp.name)).join('')).join(''));
  const dead=species.filter(s=>s.extinct!==null).slice().sort((a,b)=>b.extinct-a.extinct||species.indexOf(b)-species.indexOf(a));
  $('extinct').innerHTML=dead.slice(0,extinctExpanded?dead.length:12).map(s=>`<s title="${esc(String(s.lineage??'')).replace(/"/g,'&quot;')}">${esc(s.name)}</s>`).join(' ')
    +(!extinctExpanded&&dead.length>12?` <button type="button" aria-expanded="false">+${dead.length-12} more</button>`:'');
}

function renderEvents() {
  if (!meta) return setTimeout(renderEvents, 100);
  const groups = [], names = species.map(sp => sp.name).sort((a, b) => b.length - a.length);
  for (const e of events) {
    const found = [], text = e.text.replace(/\b[\w-]+\b/g, word => {
      const name = names.find(n => word === n || word === n + 's');
      if (!name) return word;
      found.push(name); return word === name ? '<species>' : '<species>s';
    });
    const season = Math.floor(e.t / meta.SEASON_TICKS) + 1, last = groups.at(-1);
    if (found.length && last?.season === season && last.pattern === text) { last.count++; last.names.push(...found); }
    else groups.push({ season, pattern: text, text: e.text, names: found, count: 1 });
  }
  $('events').innerHTML = groups.slice(-40).reverse().map(g => {
    const pattern = g.pattern.replace(/^A <species> is /i, '').replace(/^The <species>s? /i, '').replace(/<species>s?/g, '').trim().replace(/^[a-z]/, c => c.toLowerCase());
    const label = /^born strange:/i.test(pattern) ? 'born strange' : pattern;
    return `<li${g.count > 1 ? ` title="${esc(g.text).replace(/"/g, '&quot;')}"` : ''}><span>s${g.season}</span>${g.count > 1 ? `${esc(label)} ×${g.count} (${esc([...new Set(g.names)].join(', '))})` : esc(g.text)}</li>`;
  }).join('');
}

// Every species as a stacked band, so branching and extinction show as rivers splitting and drying up.
// Time range for both charts: the last 3 seasons, the last 30 (an age), the last 300, or the whole era. Remembered per browser.
const RANGES = { '3 seasons': 3, '30 seasons': 30, '300 seasons': 300, era: Infinity };
let range = '30 seasons';
try { range = localStorage.getItem('range') ?? range; } catch {}
if (!(range in RANGES)) range = '30 seasons';
function shownHistory() {
  if (!meta || !history.length || RANGES[range] === Infinity) return history;
  const from = history.at(-1).t - RANGES[range] * meta.SEASON_TICKS;
  return history.filter(e => e.t >= from);
}
function renderRanges() {
  $('ranges').innerHTML = Object.keys(RANGES).map(r => `<button data-range="${r}" class="${r === range ? 'on' : ''}">${r}</button>`).join('');
}
document.addEventListener('click', e => {
  const r = e.target.closest?.('[data-range]')?.dataset.range;
  if (!r) return;
  range = r;chartHover=null;highlight=null;hideEcoTip();
  try { localStorage.setItem('range', r); } catch {}
  renderRanges();
  drawChart();
});
renderRanges();

// Same founder measures as the former Evolution chart, using the latest recorded point.
function founderDrift(name) {
  const t = history.at(-1)?.traits?.[name] ?? traits[name] ?? {};
  return { code: t.driftRoot ?? t.drift, body: t.bodyRoot };
}

// When a species' members no longer all live the same way, show the split: a bar of bodies by gut
// (green: grazer, amber: both, red: meat only) and how many are mostly grazing, scavenging or hunting.
// A second way of living: a food other than the main one that makes up at least a tenth of what the species eats
// (e.g. a grazer that gets 15% of its food from dung is "part decomposer").
function sideFoods(tr) {
  const f = tr.food ?? {}, main = { decomposer: 'dung', scavenger: 'carrion', hunter: 'flesh', apex: 'flesh', parasite: 'host' }[tr.label];
  const word = { dung: 'decomposer', carrion: 'scavenger', flesh: 'hunter', host: 'parasite' };
  const side = Object.keys(word).filter(k => k !== main && (f[k] ?? 0) >= 0.1).map(k => `part ${word[k]} (${k} ${Math.round(f[k] * 100)}%)`);
  return side.length ? ' · ' + side.join(' · ') : '';
}

function dietBreakdown(tr) {
  const [g, m, f] = tr.bodies ?? [0, 0, 0], [eg, ec, ef] = tr.eating ?? [0, 0, 0], total = g + m + f;
  const mixed = [g, m, f].filter(Boolean).length > 1 || [eg, ec, ef].filter(Boolean).length > 1 || tr.turning;
  if (!total || !mixed) return '';
  const pct = v => (v / total * 100).toFixed(1);
  const parts = [eg && `${eg} mostly plants`, ec && `${ec} mostly carrion`, ef && `${ef} mostly live prey`, tr.turning && `${tr.turning} turning`].filter(Boolean).join(' · ');
  return `<span class="diet"><i style="width:${pct(g)}%;background:hsl(120 45% 45%)"></i><i style="width:${pct(m)}%;background:hsl(45 70% 50%)"></i><i style="width:${pct(f)}%;background:hsl(5 60% 50%)"></i></span>`
    + `<span title="gut: plants only ≤ 0.25 · omnivore 0.25–0.75 · meat only ≥ 0.75">guts: ${g} plants only · ${m} omnivore · ${f} meat only</span><br>lately eating: ${parts}<br>`;
}

let chartBands=null,chartHover=null;
function historyGeometry(points,all){
 const names=all.filter(sp=>points.some(e=>e.pops[sp.name]>0)).map(sp=>sp.name),max=Math.max(1,...points.map(e=>Object.values(e.pops).reduce((a,b)=>a+b,0)));
 return {points,names,max};
}
function historyHit(data,u,v){
 if(!data||u<0||u>1||v<0||v>1||data.points.length<2)return null;
 const {points,names,max}=data,t=points[0].t+u*(points.at(-1).t-points[0].t);let lo=0,hi=points.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(points[m].t<=t)lo=m;else hi=m;}
 const a=points[lo],b=points[hi],f=(t-a.t)/(b.t-a.t||1),height=(1-v)*max;let base=0;
 for(const name of names){const n=(a.pops[name]??0)*(1-f)+(b.pops[name]??0)*f;if(n>0&&height>=base&&height<=base+n)return {name,n:Math.round(n),t};base+=n;}return null;
}
function inspectHistory(e){
 const r=$('chart').getBoundingClientRect(),hit=historyHit(chartBands,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);chartHover=hit;highlight=hit?.name??null;
 if(hit)showEcoTip(e,`${hit.name}s · ${hit.n} bodies · season ${Math.floor(hit.t/meta.SEASON_TICKS)+1}`);else hideEcoTip();drawChart();
}
$('chart').addEventListener('pointermove',inspectHistory);
$('chart').addEventListener('click',inspectHistory);
$('chart').addEventListener('pointerleave',()=>{chartHover=null;highlight=null;hideEcoTip();drawChart();});
new ResizeObserver(()=>drawChart()).observe($('chart'));

function drawChart() {
  const history = shownHistory();
  $('span').textContent = history.length > 1 ? `days ${Math.floor(history[0].t / meta.TICKS_PER_DAY) + 1}–${Math.floor(history.at(-1).t / meta.TICKS_PER_DAY) + 1}` : '';
  chartBands=null;if (!meta || history.length < 2 || !species.length) return;
  chartBands=historyGeometry(history,species);
  const c = $('chart'), dpr = devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const cg = c.getContext('2d'), w = c.width, h = c.height;
  const t0 = history[0].t, t1 = history.at(-1).t, x = i => (history[i].t - t0) / (t1 - t0 || 1) * w;
  const total = e => Object.values(e.pops).reduce((a, b) => a + b, 0);
  const max = Math.max(...history.map(total), 1);
  const base = new Float32Array(history.length);
  const seen = new Set(); for (const e of history) for (const k in e.pops) if (e.pops[k]) seen.add(k);
  for (const sp of species.filter(sp => seen.has(sp.name))) {
    cg.globalAlpha=chartHover&&chartHover.name!==sp.name ? .5 : 1;
    cg.fillStyle = `hsl(${sp.hue} 55% ${(traits[sp.name]?.tl ?? 2) >= 2.5 ? 55 : 42}%)`;
    cg.beginPath();
    history.forEach((e, i) => cg.lineTo(x(i), h - (base[i] + (e.pops[sp.name] ?? 0)) / max * h));
    for (let i = history.length - 1; i >= 0; i--) cg.lineTo(x(i), h - base[i] / max * h);
    cg.closePath();cg.fill();if(chartHover?.name===sp.name){cg.strokeStyle=css('--hi');cg.lineWidth=dpr;cg.stroke();}
    history.forEach((e, i) => { base[i] += e.pops[sp.name] ?? 0; });
  }
  cg.globalAlpha=1;
  const maxPlants = Math.max(...history.map(e => e.plants), 1);
  cg.strokeStyle = css('--plantline'); cg.lineWidth = dpr;
  cg.beginPath();
  history.forEach((e, i) => cg.lineTo(x(i), h - e.plants / maxPlants * h));
  cg.stroke();
}
</script>
</body>
