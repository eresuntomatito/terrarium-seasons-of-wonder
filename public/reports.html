<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Status Reports</title>
<style>
  /* The same palette as the world viewer; light or dark follows the system unless the viewer's toggle chose one. */
  :root { --bg: #080a09; --fg: #aab6ae; --dim: #56635b; --line: #1a221d; --hi: #d4dfd7; --panel: #0e1210; --accent: #c9b77a; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc; --accent: #8a6d14; color-scheme: light; } }
  :root[data-theme="light"] { --bg: #f3f1ea; --fg: #3d4740; --dim: #7c867e; --line: #d9d6cb; --hi: #141a16; --panel: #e9e6dc; --accent: #8a6d14; color-scheme: light; }
  :root[data-theme="dark"] { --bg: #080a09; --fg: #aab6ae; --dim: #56635b; --line: #1a221d; --hi: #d4dfd7; --panel: #0e1210; --accent: #c9b77a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; color: var(--hi); font-weight: 600; }
  header a { color: var(--dim); font-size: 12px; text-decoration: none; }
  header a:hover { color: var(--hi); }
  .wrap { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 52px); }
  nav { border-right: 1px solid var(--line); padding: 12px; background: var(--panel); }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 4px 8px 8px; }
  nav button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; color: var(--fg); font: inherit; font-size: 13px; padding: 7px 10px; cursor: pointer; }
  nav button small { display: block; color: var(--dim); font-size: 11px; }
  nav button:hover { background: var(--line); }
  nav button.on { background: var(--line); color: var(--hi); }
  nav button.unread { font-weight: 600; color: var(--hi); }
  nav button.unread::before { content: '●'; color: var(--accent); margin-right: 6px; font-size: 10px; vertical-align: 1px; }
  nav h3 { font-size: 11px; color: var(--dim); margin: 18px 10px 4px; }
  header a[aria-current="page"] { color: var(--hi); text-decoration: underline; text-underline-offset: 4px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  main { padding: 24px 40px 60px; max-width: 980px; }
  main h1 { font-size: 24px; color: var(--hi); margin: 0 0 12px; }
  main h2 { font-size: 17px; color: var(--hi); margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  main h3 { font-size: 14px; color: var(--hi); margin: 20px 0 6px; }
  main p, main li { color: var(--fg); }
  main strong { color: var(--hi); }
  main code { font: 12px ui-monospace, Menlo, monospace; background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  main pre { overflow: auto; padding: 14px; background: var(--panel); border-radius: 6px; }
  main pre code { padding: 0; white-space: pre; }
  main blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--line); }
  main { min-width: 0; overflow-wrap: anywhere; }
  main table { display: block; overflow-x: auto; }
  main :is(h1,h2,h3,h4,h5,h6) { scroll-margin-top: 16px; }
  main table { border-collapse: collapse; margin: 10px 0 16px; font-size: 13px; }
  main th, main td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  main th { background: var(--panel); color: var(--hi); font-weight: 600; }
  main ul, main ol { padding-left: 22px; }
  main a { color: var(--accent); }
  main figure { margin: 12px 0 20px; } main figure img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; } main figcaption { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--dim); }
  @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 36vh; overflow-y: auto; } main { padding: 16px; } }
</style>
</head>
<body>
<header><h1 id="reader-title">World Status Reports</h1><a href="/">← back to the world</a><a id="wiki-link" href="/reports.html?section=wiki">Wiki</a><a id="reports-link" href="/reports.html">Reports</a><a id="source-link" hidden>Markdown source</a></header>
<div class="wrap">
  <nav aria-label="Reading list"><h2 id="section-title">Reports</h2><div id="list"><div class="empty">loading…</div></div></nav>
  <main id="report" aria-live="polite"><p class="empty">Choose a page.</p></main>
</div>
<script type="module" src="/reader.mjs"></script>
</body>
</html>
